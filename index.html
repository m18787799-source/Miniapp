<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnova</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #30363d;
            --modal-bg: #1c2128;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .balance-card {
            text-align: center;
            padding: 24px 16px;
        }

        .balance-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 16px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--modal-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .method-option {
            position: relative;
        }

        .method-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .method-box {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background-color: var(--card-bg);
        }

        .method-option input:checked + .method-box {
            border-color: var(--accent-color);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
        }

        .history-list {
            list-style: none;
            margin-top: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .status-pending { color: #f59e0b; }
        .status-completed { color: #10b981; }
        .status-rejected { color: #ef4444; }
    </style>
</head>
<body>

    <!-- Main Balance Dashboard -->
    <div class="card balance-card">
        <div class="balance-title">Available Balance</div>
        <div class="balance-amount" id="user-balance">$0.00</div>
        <button class="btn" onclick="openWithdrawModal()">Withdraw Funds</button>
    </div>

    <!-- Transaction History -->
    <div class="card">
        <h3>Withdrawal History</h3>
        <ul class="history-list" id="history-list">
            <li style="color: var(--text-muted); padding: 10px 0;">Loading transactions...</li>
        </ul>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal-overlay" id="withdraw-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Withdraw Funds</h3>
                <button class="close-btn" onclick="closeWithdrawModal()">&times;</button>
            </div>

            <form id="withdraw-form" onsubmit="handleWithdrawSubmit(event)">
                <div class="payment-methods">
                    <label class="method-option">
                        <input type="radio" name="withdraw_method" value="CBE Bank" checked>
                        <div class="method-box">
                            <div>CBE Bank</div>
                            <small style="color: var(--text-muted);">Commercial</small>
                        </div>
                    </label>
                    <label class="method-option">
                        <input type="radio" name="withdraw_method" value="Abyssinia">
                        <div class="method-box">
                            <div>Abyssinia</div>
                            <small style="color: var(--text-muted);">BOA Account</small>
                        </div>
                    </label>
                    <label class="method-option">
                        <input type="radio" name="withdraw_method" value="Telebirr">
                        <div class="method-box">
                            <div>Telebirr</div>
                            <small style="color: var(--text-muted);">Mobile Wallet</small>
                        </div>
                    </label>
                    <label class="method-option">
                        <input type="radio" name="withdraw_method" value="USDT BEP20">
                        <div class="method-box">
                            <div>USDT</div>
                            <small style="color: var(--text-muted);">BEP20</small>
                        </div>
                    </label>
                </div>

                <div class="input-group">
                    <label for="withdraw-amount">Amount ($)</label>
                    <input type="number" id="withdraw-amount" min="5" step="0.1" value="5" required>
                </div>

                <div class="input-group">
                    <label for="withdraw-account">Account Number / Wallet Address</label>
                    <input type="text" id="withdraw-account" placeholder="Enter details..." required>
                </div>

                <button type="submit" class="btn" id="submit-withdraw-btn">Submit Request</button>
            </form>
        </div>
    </div>

    <script>
        // --- Supabase Config ---
        const SUPABASE_URL = "YOUR_SUPABASE_URL"; // እዚህ ጋር Supabase URL ተካ
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // እዚህ ጋር Anon Key ተካ
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ETB_RATE = 125.0; // Conversion rate

        // State Management
        let currentUser = {
            id: null,
            balance: 0.00,
            pendingCount: 0
        };

        // Initialize WebApp
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();

                const tgUser = tg.initDataUnsafe?.user;
                if (tgUser) {
                    currentUser.id = tgUser.id;
                    await fetchOrCreateUser(tgUser);
                } else {
                    // Fallback for testing on desktop browser
                    currentUser.id = 123456789;
                    await fetchOrCreateUser({ id: 123456789, first_name: 'Test User' });
                }
            }
            
            updateUserUI();
            loadUserTransactions();
        });

        // Fetch User Data from Supabase
        async function fetchOrCreateUser(tgUser) {
            try {
                let { data: user, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('telegram_id', tgUser.id)
                    .single();

                if (error && error.code === 'PGRST116') {
                    // User doesn't exist, create profile
                    const { data: newUser, error: insertError } = await supabaseClient
                        .from('users')
                        .insert([{
                            telegram_id: tgUser.id,
                            first_name: tgUser.first_name || 'User',
                            balance: 10.00 // Default registration bonus for testing
                        }])
                        .select()
                        .single();

                    if (!insertError && newUser) {
                        currentUser.balance = parseFloat(newUser.balance) || 0;
                    }
                } else if (user) {
                    currentUser.balance = parseFloat(user.balance) || 0;
                }
            } catch (err) {
                console.error("User initialization error:", err);
            }
        }

        // Update UI
        function updateUserUI() {
            document.getElementById('user-balance').innerText = `$${currentUser.balance.toFixed(2)}`;
        }

        // Modal Handlers
        function openWithdrawModal() {
            document.getElementById('withdraw-modal').classList.add('active');
        }

        function closeWithdrawModal() {
            document.getElementById('withdraw-modal').classList.remove('active');
        }

        // Handle Form Submission
        async function handleWithdrawSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-withdraw-btn');
            const amount = parseFloat(document.getElementById('withdraw-amount').value);
            const account = document.getElementById('withdraw-account').value;
            const method = document.querySelector('input[name="withdraw_method"]:checked').value;

            if (amount < 5) {
                alert("Minimum withdrawal amount is $5.00 USD");
                return;
            }

            if (amount > currentUser.balance) {
                alert("Insufficient account balance!");
                return;
            }

            if (!currentUser.id) {
                alert("Telegram user not recognized!");
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Processing...";

                const newBalance = currentUser.balance - amount;

                // 1. የ Withdrawal ጥያቄውን ማስገባት
                const { error: withdrawError } = await supabaseClient
                    .from('withdrawals')
                    .insert([{
                        user_id: currentUser.id,
                        amount: amount,
                        payment_method: method,
                        account_details: account,
                        status: 'pending'
                    }]);

                if (withdrawError) {
                    console.error("Withdraw Insert Error:", withdrawError);
                    throw withdrawError;
                }

                // 2. የተጠቃሚውን Balance በ telegram_id በመፈለግ Update ማድረግ
                const { error: userError } = await supabaseClient
                    .from('users')
                    .update({ balance: newBalance })
                    .eq('telegram_id', currentUser.id);

                if (userError) {
                    console.error("User Balance Update Error:", userError);
                }

                // 3. UI Update ማድረግ
                currentUser.balance = newBalance;
                currentUser.pendingCount += 1;
                updateUserUI();
                loadUserTransactions();

                closeWithdrawModal();

                let message = `Withdrawal request of $${amount.toFixed(2)} via ${method} submitted successfully!`;
                if (method !== 'USDT BEP20') {
                    const etbTotal = (amount * ETB_RATE).toLocaleString('en-US', { minimumFractionDigits: 2 });
                    message += `\nEstimated payout: ${etbTotal} ETB`;
                }

                alert(message);

            } catch (err) {
                console.error("Withdrawal Error Details:", err);
                alert(`Failed to submit withdrawal request: ${err.message || 'Check Supabase RLS and Table Configuration'}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
            }
        }

        // Fetch User Transactions
        async function loadUserTransactions() {
            const listEl = document.getElementById('history-list');
            if (!currentUser.id) return;

            try {
                const { data, error } = await supabaseClient
                    .from('withdrawals')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    listEl.innerHTML = `<li style="color: var(--text-muted); padding: 10px 0;">No withdrawal history yet.</li>`;
                    return;
                }

                listEl.innerHTML = data.map(tx => `
                    <li class="history-item">
                        <div>
                            <strong>${tx.payment_method}</strong>
                            <div style="font-size: 12px; color: var(--text-muted);">${new Date(tx.created_at).toLocaleDateString()}</div>
                        </div>
                        <div style="text-align: right;">
                            <div>$${parseFloat(tx.amount).toFixed(2)}</div>
                            <span class="status-${tx.status}">${tx.status.toUpperCase()}</span>
                        </div>
                    </li>
                `).join('');

            } catch (err) {
                console.error("History loading error:", err);
                listEl.innerHTML = `<li style="color: #ef4444; padding: 10px 0;">Failed to load history.</li>`;
            }
        }
    </script>
</body>
</html>
